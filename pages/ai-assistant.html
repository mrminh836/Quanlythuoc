<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Smart Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .page-content {
            display: flex;
            gap: var(--spacing-lg);
            height: calc(100vh - var(--header-height));
            padding-bottom: 0;
            overflow: hidden;
        }

        /* Left side: AI Insights */
        .ai-insights-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            overflow-y: auto;
            padding-bottom: var(--spacing-xl);
        }

        .insight-card {
            background: linear-gradient(145deg, var(--bg-surface) 0%, var(--primary-light) 100%);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
        }

        .insight-card.warning { border-left-color: var(--warning-color); background: linear-gradient(145deg, var(--bg-surface) 0%, #FEF3C7 100%); }
        .insight-card.danger { border-left-color: var(--danger-color); background: linear-gradient(145deg, var(--bg-surface) 0%, #FEE2E2 100%); }
        .insight-card.success { border-left-color: var(--success-color); background: linear-gradient(145deg, var(--bg-surface) 0%, var(--secondary-light) 100%); }

        .insight-title {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .insight-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Right side: Chat Window */
        .ai-chat-panel {
            flex: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: var(--spacing-md);
            box-shadow: var(--shadow-sm);
        }

        .chat-header {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(90deg, var(--bg-surface) 0%, var(--primary-light) 100%);
        }

        .chat-header-title {
            font-weight: 600;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            flex: 1;
            padding: var(--spacing-lg);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .message {
            max-width: 80%;
            display: flex;
            gap: 12px;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }

        .message.ai .message-avatar {
            background-color: var(--primary-light);
            color: var(--primary-color);
            font-size: 1.2rem;
        }

        .message.user .message-avatar {
            background-color: var(--border-color);
            color: var(--text-secondary);
        }

        .message-bubble {
            background-color: var(--bg-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .message.user .message-bubble {
            background-color: var(--primary-color);
            color: white;
            border-top-right-radius: 2px;
        }

        .message.ai .message-bubble {
            border-top-left-radius: 2px;
            border: 1px solid var(--border-color);
        }

        /* Suggestions */
        .chat-suggestions {
            padding: 0 var(--spacing-lg) var(--spacing-sm) var(--spacing-lg);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-chip {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--primary-color);
        }

        .suggestion-chip:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .chat-input-area {
            padding: var(--spacing-md);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            font-family: inherit;
            resize: none;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input:focus {
            border-color: var(--primary-color);
        }

        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
        }
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 1024px) {
            .page-content { flex-direction: column-reverse; overflow-y: auto; padding-bottom: var(--spacing-xl); }
            .ai-insights-panel { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
            .ai-chat-panel { height: 60vh; flex: none; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>

            <div class="page-content" style="padding: var(--spacing-lg);">
                
                <!-- Left: AI Insights Dashboard -->
                <div class="ai-insights-panel" id="insights-panel">
                    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 8px;">AI Insights Dashboard</h3>
                    <!-- Insights will be injected here by JS -->
                </div>

                <!-- Right: AI Chat -->
                <div class="ai-chat-panel">
                    <div class="chat-header">
                        <div class="chat-header-title">
                            <i class="fa-solid fa-sparkles"></i>
                            Gemini Pharmacy Assistant
                        </div>
                        <button class="btn btn-outline" style="padding: 4px 8px; font-size: 0.75rem;" onclick="AI.clearChat()">
                            <i class="fa-solid fa-broom"></i> Xóa hội thoại
                        </button>
                    </div>

                    <div class="chat-messages" id="chat-messages">
                        <div class="message ai">
                            <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                            <div class="message-bubble">
                                Chào bạn! Tôi là trợ lý AI (Mô phỏng Gemini). Tôi có thể giúp bạn phân tích dữ liệu kho, gợi ý nhập hàng hoặc xem báo cáo kinh doanh. Bạn muốn hỏi gì?
                            </div>
                        </div>
                    </div>

                    <div class="chat-suggestions">
                        <div class="suggestion-chip" onclick="AI.ask('Thuốc nào sắp hết hạn?')">Thuốc nào sắp hết hạn?</div>
                        <div class="suggestion-chip" onclick="AI.ask('Sản phẩm nào sắp hết hàng?')">Sản phẩm nào sắp hết hàng?</div>
                        <div class="suggestion-chip" onclick="AI.ask('Gợi ý nhập hàng')">Gợi ý nhập hàng</div>
                        <div class="suggestion-chip" onclick="AI.ask('Doanh thu hôm nay thế nào?')">Doanh thu hôm nay thế nào?</div>
                    </div>

                    <div class="chat-input-area">
                        <textarea class="chat-input" id="chat-input" rows="1" placeholder="Nhập câu hỏi tại đây... (Nhấn Enter để gửi)" onkeypress="if(event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); AI.sendInput(); }"></textarea>
                        <button class="btn btn-primary send-btn" onclick="AI.sendInput()">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/ai.js"></script>
    <script>
        Auth.requireAuth();
        if(!Auth.hasPermission('ai')) {
            window.location.href = 'dashboard.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderSidebar('ai');
            Layout.renderHeader('AI Assistant');
            AI.init();
        });
    </script>
</body>
</html>
