<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hỗ trợ - AINA Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="app-sidebar"></aside>
        <main class="main-content">
            <header class="header" id="app-header"></header>
            
            <div class="content-area">
                <div style="text-align: center; max-width: 600px; margin: 4rem auto;">
                    <i class="fa-solid fa-headset text-primary" style="font-size: 5rem; margin-bottom: 2rem;"></i>
                    <h2>Trung tâm hỗ trợ</h2>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">Nếu bạn gặp khó khăn trong quá trình sử dụng hệ thống, vui lòng liên hệ bộ phận kỹ thuật để được trợ giúp.</p>
                    
                    <div style="background: white; padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); text-align: left;">
                        <h4 style="margin-bottom: 1rem;"><i class="fa-solid fa-phone"></i> Hotline kỹ thuật</h4>
                        <p style="margin-bottom: 1.5rem; font-weight: bold; color: var(--primary-color);">1900 9999</p>
                        
                        <h4 style="margin-bottom: 1rem;"><i class="fa-solid fa-envelope"></i> Email hỗ trợ</h4>
                        <p style="margin-bottom: 1.5rem;">support@smartpharmacy.local</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.requireAuth();
            Layout.renderSidebar('');
            Layout.renderHeader('Hỗ trợ');
        });
    </script>
</body>
</html>
