<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu thích - AINA Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/shop.css">
</head>
<body class="shop-layout">

    <header class="shop-header">
        <div class="shop-header-top">
            <a href="shop.html" class="shop-logo"><img src="../assets/images/ainalogo.png" class="shop-logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/8687/8687597.png'" alt="Logo">
                <div class="shop-logo-text">
                    <span class="shop-logo-top">NHÀ THUỐC</span>
                    <span class="shop-logo-bottom">AINA</span>
                </div></a>
            <div class="shop-search-bar">
                <input type="text" id="shop-search-input" placeholder="Tìm kiếm thuốc, sản phẩm, hoạt chất..." onkeypress="if(event.key === 'Enter') window.location.href='shop.html'">
                <button onclick="window.location.href='shop.html'"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="shop-header-actions">
                <a href="shop-account.html" class="shop-action-btn"><i class="fa-solid fa-user"></i><span>Tài khoản</span></a>
                <a href="wishlist.html" class="shop-action-btn"><i class="fa-solid fa-heart" style="color:var(--shop-accent)"></i><span style="color:var(--shop-accent); font-weight:bold;">Yêu thích</span><span class="shop-cart-badge" id="wishlist-count" style="display: none;">0</span></a>
                <a href="#" class="shop-action-btn" onclick="Cart.toggleDrawer(event)"><i class="fa-solid fa-cart-shopping"></i><span>Giỏ hàng</span><span class="shop-cart-badge" id="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <div class="shop-container" style="max-width: 800px;">
        <h2 style="margin-bottom: 2rem;">Danh sách yêu thích của tôi</h2>
        <div id="wishlist-grid" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Wishlist items injected here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/wishlist.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Wishlist.renderPage();
        });
    </script>
<script src="../js/shop-ai.js"></script>
</body>
</html>
