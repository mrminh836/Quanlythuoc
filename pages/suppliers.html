<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà cung cấp - AINA Pharmacy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="app-sidebar"></aside>
        <main class="app-main">
            <header class="app-header" id="app-header"></header>

            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">Nhà cung cấp</h1>
                    <button class="btn btn-primary" onclick="SupplierManager.openModal()">
                        <i class="fa-solid fa-plus"></i> Thêm NCC
                    </button>
                </div>

                <div class="card">
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Mã NCC</th>
                                    <th>Tên nhà cung cấp</th>
                                    <th>Liên hệ</th>
                                    <th>Địa chỉ</th>
                                    <th style="text-align: right;">Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="supplier-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="supplier-modal">
        <div class="modal">
            <div class="modal-header">
                <span id="modal-title">Thêm Nhà Cung Cấp</span>
                <button class="modal-close" onclick="SupplierManager.closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <form id="supplier-form">
                    <input type="hidden" id="edit-id">
                    <div class="form-group">
                        <label class="form-label">Tên nhà cung cấp *</label>
                        <input type="text" id="s-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Số điện thoại *</label>
                        <input type="tel" id="s-phone" class="form-control" required pattern="[0-9]{10,11}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Địa chỉ</label>
                        <input type="text" id="s-address" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="SupplierManager.closeModal()">Hủy</button>
                <button class="btn btn-primary" onclick="SupplierManager.saveSupplier()"><i class="fa-solid fa-save"></i> Lưu</button>
            </div>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/suppliers.js"></script>
    <script>
        Auth.requireAuth();
        if(!Auth.hasPermission('suppliers')) {
            window.location.href = 'dashboard.html';
        }
        document.addEventListener('DOMContentLoaded', () => {
            Layout.renderSidebar('suppliers');
            Layout.renderHeader('Nhà cung cấp');
            SupplierManager.init();
        });
    </script>
</body>
</html>
